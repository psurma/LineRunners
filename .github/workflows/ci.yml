# Enforces the safety-critical pre-commit guards on every push/PR, so they can't
# be bypassed by a fresh clone that never installed .git/hooks/pre-commit, a
# `git commit --no-verify`, or a second contributor. Mirrors tools/pre-commit
# minus the file-mutating steps (cache-buster bump). No dependencies to install —
# Overland is dependency-free vanilla JS (no package.json).
name: CI

on:
  push:
  pull_request:

# Read-only: nothing here writes to the repo, and the default token scope is wider.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs — a mutable v4 tag can be repointed at
      # any commit by whoever controls the action.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the schedule check dates data/schedule.json from git history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Syntax check (script.js)
        run: node -c script.js

      - name: No duplicate top-level functions
        # Two `function name` (or `async function name`) in the same scope
        # silently shadow each other — a duplicate journeySegments once blanked
        # most of the page. Same guard the pre-commit hook runs.
        run: |
          dups=$(grep -aoE '^  (async )?function [A-Za-z0-9_]+' script.js | sed 's/async //' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate top-level function(s) in script.js — rename one:"
            echo "$dups"
            exit 1
          fi

      - name: Regenerate schedule
        # Keeps the validator's date-sensitive schedule-freshness check stable in
        # CI regardless of the run date; not committed, just to satisfy the check.
        # SOURCE_DATE_EPOCH pins it to the day data/schedule.json was last committed,
        # so the rebuild is reproducible and can be diffed against the committed file
        # below. The date is read in the committer's own timezone (that's the calendar
        # day the generator saw) and handed over as midday UTC, so a late-evening BST
        # commit doesn't rebuild as the day before.
        run: |
          day=$(git log -1 --format=%cd --date=format:%Y-%m-%d -- data/schedule.json)
          SOURCE_DATE_EPOCH=$(date -u -d "${day:-$(date -u +%F)} 12:00:00" +%s) node tools/generate-schedule.mjs

      - name: Committed schedule is in step with RUN_PLAN
        # Without this the validator below only ever compares freshly generated output
        # against itself, so a `git commit --no-verify` carrying a stale schedule.json
        # sailed through green. The regenerated file must match what's committed.
        run: git diff --exit-code data/schedule.json

      - name: Validate derived data
        run: node tools/validate-data.mjs

      - name: Unit tests
        run: node --test tools/test/*.test.mjs
