<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tube Run — style bake-off</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Inter", system-ui, -apple-system, sans-serif; background: #eef0f4; color: #10131c; line-height: 1.5; padding: 32px 20px 60px; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 30px; margin-bottom: 6px; }
    .intro { color: #5b6472; margin-bottom: 26px; max-width: 640px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { background: #fff; border: 1px solid #e2e5ea; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 20px rgba(16,19,28,0.06); }
    .thumb { display: block; aspect-ratio: 16 / 10; background: #f2f3f6; overflow: hidden; border-bottom: 1px solid #e2e5ea; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .thumb .ph { display: flex; align-items: center; justify-content: center; height: 100%; color: #99a; font-size: 13px; }
    .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .body h2 { font-size: 18px; }
    .body p { color: #5b6472; font-size: 13px; flex: 1; }
    .open { align-self: flex-start; margin-top: 6px; background: #0019a8; color: #fff; text-decoration: none; font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 8px; }
    .open:hover { background: #dc241f; }
    .card.default { outline: 2px dashed #b6bcc7; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tube Run — pick a style</h1>
    <p class="intro">Ten different looks for the same site, generated as swappable themes. Click <strong>Open live</strong> to explore any one in full (the maps, filters and planner all work), then tell me which you'd like to keep — or mix and match.</p>
    <div class="grid" id="grid"></div>
  </div>
  <script src="styles/gallery.js"></script>
</body>
</html>
